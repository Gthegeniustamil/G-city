<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G City - Build Your Dream Town</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game">
  <header class="topbar">
    <div>
      <h1>🏙️ G City</h1>
      <small>Build Your Dream Town</small>
    </div>
    <div class="stats">
      <span>🪙 <b id="coins">500</b></span>
      <span>⭐ <b id="xp">0</b></span>
      <span>🏠 <b id="population">0</b></span>
    </div>
  </header>

  <section class="levelbar">
    <div><b>Level <span id="level">1</span></b><span id="xpText">0 / 100 XP</span></div>
    <div class="xp-track"><div id="xpFill"></div></div>
  </section>

  <main>
    <div class="town-wrap">
      <div id="town" class="town"></div>
      <div id="toast" class="toast"></div>
    </div>

    <aside class="panel">
      <h2>🏗️ Build</h2>
      <div class="build-grid">
        <button class="build" data-type="house" data-cost="100">🏠<b>House</b><small>100 🪙</small></button>
        <button class="build" data-type="farm" data-cost="80">🌾<b>Farm</b><small>80 🪙</small></button>
        <button class="build" data-type="bakery" data-cost="180">🏭<b>Bakery</b><small>180 🪙</small></button>
        <button class="build" data-type="market" data-cost="250">🏪<b>Market</b><small>250 🪙</small></button>
        <button class="build" data-type="road" data-cost="20">🛣️<b>Road</b><small>20 🪙</small></button>
        <button class="build" data-type="tree" data-cost="15">🌳<b>Tree</b><small>15 🪙</small></button>
      </div>

      <h2>📦 Orders</h2>
      <div class="order">
        <div><b>Bakery Order</b><p>🍞 1 Bread</p></div>
        <button id="sellBread">Sell +120 🪙<br><small>Needs Bakery</small></button>
      </div>

      <h2>⚡ Actions</h2>
      <button id="collect" class="wide">💰 Collect Town Income</button>
      <button id="save" class="wide secondary">💾 Save Game</button>
      <button id="reset" class="wide danger">🔄 New Game</button>
    </aside>
  </main>

  <footer>G City Prototype • Original game concept • Mobile friendly</footer>
</div>
<script src="script.js"></script>
</body>
</html>
